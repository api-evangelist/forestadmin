apis:
  - aid: forestadmin:admin-api
    name: Forest Admin REST API (Admin Backend)
    description: >
      The Forest Admin Admin Backend is a REST API deployed on the customer's own
      infrastructure. It translates UI calls from the Forest Admin browser interface
      into database queries covering CRUD operations, search and filters, pagination,
      sorting, smart actions, and chart rendering. Authentication uses dual JWT tokens
      (FOREST_ENV_SECRET and FOREST_AUTH_SECRET). Agents are available for Node.js,
      Ruby on Rails, Django, Flask, Laravel, and Symfony.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.forestadmin.com/documentation
    baseURL: https://app.forestadmin.com
    tags:
      - admin
      - REST
      - CRUD
      - JWT
      - collections
      - actions
      - charts
    properties:
