description: >
  Forest Admin is an ops orchestration platform and internal tool builder that enables
  operations and compliance teams to manage data, workflows, and business processes through
  a customizable admin panel. It uses an agent-based architecture where developers deploy
  a REST API agent (Admin Backend) on their own infrastructure, keeping data entirely within
  client-controlled servers. The platform supports Node.js, Ruby on Rails, Python (Django/Flask),
  and PHP (Laravel/Symfony) agents that introspect data models and expose CRUD, filtering,
  pagination, and sorting capabilities through a generated Admin API. Forest Admin includes
  role-based access control (RBAC), JWT-based dual authentication, AI-assisted workflows,
  MCP server integration, SOC 2 compliance, and human-AI collaboration features for regulated
  industries such as fintech, KYC/AML, and payments operations.
