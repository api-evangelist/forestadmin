annualDiscount: 20%

focusColumns:
  - ChargeType: Usage
  - ServiceName: Forest Admin Admin Panel
  - ServiceCategory: Internal Tools / Operations Orchestration
  - PublisherName: Forest Admin
  - ResourceType: User Seat
  - BillingCurrency: USD
  - ListUnitPrice: 60.00
  - ListCostPerMonth: varies-by-seat-count
